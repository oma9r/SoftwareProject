name: SonarCloud Analysis

on:
  push:
    branches:
      - main  # or your default branch name
  pull_request:
    branches:
      - main  # or your default branch name

jobs:
  sonarcloud:
    name: Analyze on SonarCloud
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up JDK (Java Development Kit) for SonarCloud analysis
      - name: Set up JDK 22
        uses: actions/setup-java@v3
        with:
          java-version: '22'
          distribution: 'temurin'

      # Install SonarScanner
      - name: Install SonarScanner
        run: |
          curl -sS https://get.sonarsource.com/sonar-scanner-cli/sonar-scanner-cli-4.7.0.2747-linux.zip -o sonar-scanner.zip
          unzip sonar-scanner.zip -d /opt/sonar-scanner
          echo "export PATH=$PATH:/opt/sonar-scanner/sonar-scanner-4.7.0.2747-linux/bin" >> $GITHUB_ENV

      # Run the SonarCloud analysis
      - name: Run SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONARTOKEN }}  # This references the secret token
        run: |
          sonar-scanner \
            -Dsonar.projectKey=SoftwareProjectOrganization_SoftwareProject \
            -Dsonar.organization=SoftwareProjectOrganization \
            -Dsonar.login=$SONARTOKEN
