name: SonarCloud Analysis

on:
  push:
    branches:
      - main  # or your default branch name
  pull_request:
    branches:
      - main  # or your default branch name

jobs:
  sonarcloud:
    name: Analyze on SonarCloud
    runs-on: ubuntu-latest  # Keep this as 'ubuntu-latest'

    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up JDK (Java Development Kit) for SonarCloud analysis
      - name: Set up JDK 22
        uses: actions/setup-java@v3
        with:
          java-version: '22'
          distribution: 'temurin'

      # Use the official SonarCloud GitHub Action to handle the installation and analysis
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-action@v2
        with:
        sonar-project-key: SoftwareProjectOrganization_SoftwareProject  # Use 'sonar-project-key' instead of 'projectKey'
        sonar-organization: SoftwareProjectOrganization  # Use 'sonar-organization' instead of 'organization'
        env:
          SONAR_TOKEN: ${{ secrets.SONARTOKEN }}  # This references the secret token
